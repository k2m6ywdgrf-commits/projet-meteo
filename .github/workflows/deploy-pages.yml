name: Déploiement GitHub Pages (via Actions)

# Pipeline de secours au pipeline "classic" (Jekyll build) intégré à GitHub,
# qui reste bloqué en file d'attente sur ce dépôt depuis plusieurs tentatives.
# Ce workflow utilise le mécanisme moderne « Build and deployment: GitHub
# Actions » de Pages, qui passe par un chemin de code différent côté GitHub.
#
# Pour l'activer : Settings → Pages → Build and deployment → Source →
# choisir « GitHub Actions » (au lieu de « Deploy from a branch »).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
